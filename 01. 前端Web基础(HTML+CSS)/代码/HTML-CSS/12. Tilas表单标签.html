<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表单标签</title>
</head>
<body>
<!--
表单标签

● 表单: 在网页中主要负责数据采集功能，如 注册、登录等数据采集。

● 标签: <form>

● 表单项: 不同类型的 input 元素、下拉列表、文本域等。
  
  • <input>: 定义表单项, 通过type属性控制输入形式 (text/password/...)
  
  • <select>: 定义下拉列表
  
  • <textarea>: 定义文本域

● 属性:
  action: 表单数据提交的 URL 地址

  method: 提交方式

    get: 默认，表单数据会出现在 url 后面，形式：/save?name=Tom&age=18
    特点：
      1. 如果表单中包含了隐私数据，get 方式并不安全，不推荐使用该方式。
      2. 在浏览器中 get 请求的大小是有限制的，不适合提交大数据量的表单。

    post: 表单数据会在消息体/请求体中提交到服务器
    特点：
      1. 安全。
      2. 请求大小没有限制。

  注意：表单项要想能够采集数据，必须得设置 name 属性，表示当前表单项的名字
-->
  <form action="/save" method="post">
    姓名: <input type="text" name="name">
    <!--  也可以写到里面： <input type="text" name="name" value="姓名">     -->

    年龄: <input type="text" name="age">
    <input type="submit" value="提交">
  </form>
</body>
</html>
