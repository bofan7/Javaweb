<!-- 
1. <html> 与 </html> —— 网页的“皮肤”与边界
作用： 它是整个网页的根标签。
讲解： 所有的网页内容（除了极少数声明外）都必须包裹在 <html> 和 </html> 之间。它告诉浏览器：“这中间的所有内容都是 HTML 代码，请用网页的方式来解析我。”
-->
<html>
    
    <!-- 
    2. <head> 与 </head> —— 网页的“大脑/幕后”
    作用： 存放网页的元数据（Metadata），也就是给浏览器和搜索引擎看的信息，里面的内容不会直接显示在网页的白色正文区。
    -->
    <head>
        <!-- 
        包含内容：
        <title>HTML快速入门</title>：这是网页的标题。它会显示在浏览器的标签页（Tab）上，或者你收藏该网页时默认的名字。
        -->
        <title>HTML快速入门</title>
    </head>
    
    <!-- 
    3. <body> 与 </body> —— 网页的“身体/前台”
    作用： 存放网页的主体内容。只要是你想让用户在浏览器窗口里真正看得到、摸得着的东西（文字、图片、视频、按钮），全部都要写在这里面。
    -->
    <body>
        <!-- 
        包含内容：
        <h1>Hello HTML</h1>：这是一个一级标题标签（Heading 1）。浏览器会自动把它里面的文字变大、加粗，通常用来做页面的核心大标题。
        -->
        <h1>Hello HTML</h1>
        
        <!-- 
        <img src="img/1.png">：这是一个图片标签（Image）。
        src="img/1.png" 是它的属性，代表图片的路径（Source）。这行代码的意思是：去当前文件夹底下的 img 文件夹里，找到一张名为 1.png 的图片并显示出来。
        -->
        <img src="img/1.png">
    </body>
</html>
