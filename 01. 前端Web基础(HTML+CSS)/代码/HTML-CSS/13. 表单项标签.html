<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML-表单项标签</title>
</head>
<body>
<!--
表单标签

● 表单: 在网页中主要负责数据采集功能，如 注册、登录等数据采集。

● 标签: <form>

● 表单项: 不同类型的 input 元素、下拉列表、文本域等。
  
  • <input>: 定义表单项, 通过type属性控制输入形式 (text/password/...)
  
  • <select>: 定义下拉列表
  
  • <textarea>: 定义文本域

● 属性:
  action: 表单数据提交的 URL 地址

  method: 提交方式

    get: 默认，表单数据会出现在 url 后面，形式：/save?name=Tom&age=18
    特点：
      1. 如果表单中包含了隐私数据，get 方式并不安全，不推荐使用该方式。
      2. 在浏览器中 get 请求的大小是有限制的，不适合提交大数据量的表单。

    post: 表单数据会在消息体/请求体中提交到服务器
    特点：
      1. 安全。
      2. 请求大小没有限制。

  注意：表单项要想能够采集数据，必须得设置 name 属性，表示当前表单项的名字
-->



<form action="/save" method="post">
     姓名: <input type="text" name="name"> <br><br>
<!--  也可以写到里面： <input type="text" name="name" value="姓名">     -->

     密码: <input type="password" name="password"> <br><br> 

     性别: <input type="radio" name="gender" value="1"> 男
          <label><input type="radio" name="gender" value="2"> 女 </label> <br><br>
     
     爱好: <label><input type="checkbox" name="hobby" value="java"> java </label>
          <label><input type="checkbox" name="hobby" value="game"> game </label>
          <label><input type="checkbox" name="hobby" value="sing"> sing </label> <br><br>
     <!-- 没有 label：只能点击小方框 -->
     <!-- 有 label：点击文字也能选中 -->

     图像: <input type="file" name="image">  <br><br>

     生日: <input type="date" name="birthday"> <br><br>

     时间: <input type="time" name="time"> <br><br>

     日期时间: <input type="datetime-local" name="datetime"> <br><br>

     学历: <select name="degree">
               <option value="">----------- 请选择 -----------</option>
               <option value="1">大专</option>
               <option value="2">本科</option>
               <option value="3">硕士</option>
               <option value="4">博士</option>
          </select>  <br><br>

     描述: <textarea name="description" cols="30" rows="10"></textarea>  <br><br>
     
     <input type="hidden" name="id" value="1">

     <!-- 表单常见按钮，他们是例外不需要 name -->
     <input type="button" value="按钮">
     <input type="reset" value="重置"> 
     <input type="submit" value="提交">   
     <br>
</form>

</body>
</html>
<!--
input 标签 type 属性取值说明

type取值              描述                                    形式
----------------------------------------------------------------------
text                 默认值，定义单行的输入字段                张无忌

password             定义密码字段                             ......

radio                定义单选按钮                             ○男 ○女

checkbox             定义复选框                               □Java □Game

file                 定义文件上传按钮                         [选择文件] 未选择任何文件

date/time/           定义日期/时间/日期时间                   [年/月/日 ▢] [--:-- ○] [年/月/日 --:-- ▢]
datetime-local

hidden               定义隐藏域

submit / reset /     定义提交按钮 / 重置按钮 / 可点击按钮      [提交] [重置] [按钮]
button
-->
