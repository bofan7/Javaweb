<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我是浏览页标题</title>
</head>
<body>
  <!--定义一个正文标题: 用 h1 h2 ...h6-->
  <h1>我是正文标题</h1>

  <!--a代表超链接
      href 为地址
      target 为打开方式
        _blank:新窗口打开
        _self:本窗口
  -->
  <a href="https://www.cctv.com" target="_blank">我是链接的名字</a>
  我是日期: 2024年
</body>
</html>
